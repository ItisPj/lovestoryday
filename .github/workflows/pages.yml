name: Publish wedding invitation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Download invitation music
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 https://rsvp.lovestoryday.ru/beloe-plate.mp3 -o site/beloe-plate.mp3
          echo 'b4b55aa97e257e3d56cf94d824ad6e4d5293369495d99cf1327b929d43756a8e  site/beloe-plate.mp3' | sha256sum --check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
