name: Publish wedding invitation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Download invitation music
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 https://rsvp.lovestoryday.ru/budu-vsegda-s-toboy.mp3 -o site/budu-vsegda-s-toboy.mp3
          echo '98fd45ae084446e6409dc76d4907a8348493a10f2f585d3a7cd999954010fbf7  site/budu-vsegda-s-toboy.mp3' | sha256sum --check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
